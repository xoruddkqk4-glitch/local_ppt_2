<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>품사와 문장성분 인터랙티브 슬라이드</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #eef3fb;
      --text: #142236;
      --muted: #5c6b82;
    }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg); overflow: hidden;
    }
    body {
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      color: var(--text);
    }
    .app {
      width: 100vw; height: 100vh;
      display: grid; place-items: center;
      position: relative; overflow: hidden;
    }
    .frame {
      width: min(100vw, calc(100vh * 1600 / 900));
      height: min(100vh, calc(100vw * 900 / 1600));
      max-width: 100vw; max-height: 100vh;
    }
    .frame svg { display: block; width: 100%; height: 100%; }
    .guide {
      position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
      z-index: 2; padding: 10px 16px; border-radius: 16px;
      background: rgba(255,255,255,0.88); border: 1px solid rgba(172, 193, 231, 0.8);
      color: #48607F; font-size: 14px; font-weight: 600;
      box-shadow: 0 8px 20px rgba(127, 154, 201, 0.16);
      backdrop-filter: blur(8px); white-space: nowrap;
    }
    .guide strong { color: #274A92; }
    svg text { letter-spacing: -0.02em; user-select: none; }
    .node { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: transform 180ms ease, opacity 180ms ease; }
    .node:hover { transform: scale(1.03); }
    .node:focus-visible .node-shape, .ui-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(31, 95, 255, 0.35); }
    .node:focus-visible .node-shape { stroke: #1F5FFF; stroke-width: 4; }
    .node-shape, .edge, .edge-halo { transition: opacity 200ms ease, transform 200ms ease, stroke-width 200ms ease, filter 200ms ease; }
    .edge-group { transition: opacity 200ms ease; }
    #diagram.dimmed .node { opacity: 0.16; }
    #diagram.dimmed .edge-group { opacity: 0; }
    #diagram.dimmed .node.is-active, #diagram.dimmed .node.is-linked { opacity: 1; }
    #diagram.dimmed .edge-group.is-active { opacity: 1; }
    #diagram.arrows-hidden .edge-group { opacity: 0; }
    #diagram:not(.col-left-open) .node-left,
    #diagram:not(.col-middle-open) .node-middle,
    #diagram:not(.col-right-open) .node-right {
      visibility: hidden;
      pointer-events: none;
    }
    #diagram:not(.col-left-open) .edge-group[data-from^="L-"],
    #diagram:not(.col-middle-open) .edge-group[data-from^="L-"],
    #diagram:not(.col-middle-open) .edge-group[data-from^="M-"],
    #diagram:not(.col-right-open) .edge-group[data-from^="M-"] {
      visibility: hidden;
      pointer-events: none;
    }
    #diagram:not(.col-left-open):not(.col-middle-open):not(.col-right-open) .diagram-extras {
      visibility: hidden;
    }
    .column-header { cursor: pointer; }
    .column-header rect { transition: filter 160ms ease, stroke-width 160ms ease; }
    .column-header:hover rect { filter: brightness(1.06); }
    .column-header.is-open rect { stroke: #8EB0FF; stroke-width: 2; }
    .column-header:focus-visible rect { outline: none; stroke: #1F5FFF; stroke-width: 3; }
    .node.is-active { filter: url(#focusGlow); }
    .node.is-active .node-shape { stroke-width: 4.5; }
    .node.is-linked .node-shape { stroke-width: 3.5; }
    .edge-group.is-active .edge { stroke-width: 10; }
    .edge-group.is-active .edge-halo { opacity: 1; stroke-width: 16; }
    .ui-btn {
      appearance: none; border: 1px solid rgba(172, 193, 231, 0.9);
      background: rgba(255,255,255,0.94); color: #274A92;
      font: inherit; font-size: 15px; font-weight: 700;
      padding: 12px 18px; border-radius: 16px; cursor: pointer;
      box-shadow: 0 8px 20px rgba(127, 154, 201, 0.16);
      backdrop-filter: blur(8px); transition: background 160ms ease;
      position: absolute; z-index: 3;
    }
    .ui-btn:hover { background: #E8F0FF; }
    .ui-btn:disabled { opacity: 0.65; cursor: wait; }
    #resetButton { top: 18px; left: 18px; }
    #pdfButton { top: 18px; right: 18px; }
    @media print {
      body { background: #fff; overflow: visible; }
      .guide, .ui-btn { display: none !important; }
      .app { width: 100%; height: auto; display: block; }
      .frame { width: 100%; height: auto; max-width: none; max-height: none; }
    }
  </style>
</head>

      diagram.classList.toggle('col-middle-open', openColumns.middle);
      diagram.classList.toggle('col-right-open', openColumns.right);

      headerEls.forEach((header) => {
        const column = header.dataset.column;
        const isOpen = !!openColumns[column];
        header.classList.toggle('is-open', isOpen);
        header.setAttribute('aria-expanded', String(isOpen));
      });
    }

    function clearSelectionsInColumn(column) {
      [...selectedIds].forEach((id) => {
        if (getNodeColumn(id) === column) selectedIds.delete(id);
      });
    }

    function toggleColumn(column) {
      openColumns[column] = !openColumns[column];
      if (!openColumns[column]) clearSelectionsInColumn(column);
      syncColumnClasses();

      if (selectedIds.size) renderSelection();
      else if (viewMode === 'focus') showAllArrows();
    }

    function clearSelectionClasses() {
      nodeEls.forEach((el) => el.classList.remove('is-active', 'is-linked'));
      edgeEls.forEach((el) => el.classList.remove('is-active'));
    }

    function updateToggleButton() {
      const showAllLabel = '화살표 전체 보기';
      const hideAllLabel = '화살표 전체 숨기기';
      const label = viewMode === 'all' ? hideAllLabel : showAllLabel;
      resetButton.textContent = label;
      resetButton.setAttribute('aria-label', label);
    }

    function showAllArrows() {
      selectedIds.clear();
      viewMode = 'all';
      diagram.classList.remove('dimmed', 'arrows-hidden');
      clearSelectionClasses();
      updateToggleButton();
    }

    function hideAllArrows() {
      selectedIds.clear();
      viewMode = 'hidden';
      diagram.classList.remove('dimmed');
      diagram.classList.add('arrows-hidden');
      clearSelectionClasses();
      updateToggleButton();
    }

    function toggleArrowView() {
      if (viewMode === 'all') hideAllArrows();
      else showAllArrows();
    }

    function renderSelection() {
      if (!selectedIds.size) {
        showAllArrows();
        return;
      }

      viewMode = 'focus';
      diagram.classList.remove('arrows-hidden');
      diagram.classList.add('dimmed');

      const linkedNodes = new Set();
      selectedIds.forEach((id) => {
        (connectedMap.get(id) || new Set([id])).forEach((linkedId) => linkedNodes.add(linkedId));
      });

      nodeEls.forEach((el) => {
        const currentId = el.dataset.nodeId;
        el.classList.remove('is-active', 'is-linked');
        if (selectedIds.has(currentId)) el.classList.add('is-active');
        else if (linkedNodes.has(currentId)) el.classList.add('is-linked');
      });

      edgeEls.forEach((el) => {
        const active = selectedIds.has(el.dataset.from) || selectedIds.has(el.dataset.to);
        el.classList.toggle('is-active', active);
      });

      updateToggleButton();
    }

    function activateNode(nodeId, multi = false) {
      const column = getNodeColumn(nodeId);
      if (column && !openColumns[column]) return;

      if (multi) {
        if (selectedIds.has(nodeId)) selectedIds.delete(nodeId);
        else selectedIds.add(nodeId);
      } else {
        selectedIds.clear();
        selectedIds.add(nodeId);
      }
      renderSelection();
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
      });
    }

    function prepareCloneForExport(clone) {
      const isDimmed = clone.classList.contains('dimmed');
      const isHidden = clone.classList.contains('arrows-hidden');
      const leftOpen = clone.classList.contains('col-left-open');
      const middleOpen = clone.classList.contains('col-middle-open');
      const rightOpen = clone.classList.contains('col-right-open');
      const anyOpen = leftOpen || middleOpen || rightOpen;

      clone.querySelectorAll('.node').forEach((node) => {
        const isLeft = node.classList.contains('node-left');
        const isMiddle = node.classList.contains('node-middle');
        const isRight = node.classList.contains('node-right');
        const columnOpen = (isLeft && leftOpen) || (isMiddle && middleOpen) || (isRight && rightOpen);

        if (!columnOpen) {
          node.setAttribute('opacity', '0');
          return;
        }

        if (isDimmed) {
          const keep = node.classList.contains('is-active') || node.classList.contains('is-linked');
          node.setAttribute('opacity', keep ? '1' : '0.16');
        } else {
          node.setAttribute('opacity', '1');
        }

        const shape = node.querySelector('.node-shape');
        if (!shape) return;
        if (node.classList.contains('is-active')) {
          shape.setAttribute('stroke-width', '4.5');
          shape.setAttribute('filter', 'url(#focusGlow)');
        } else if (node.classList.contains('is-linked')) {
          shape.setAttribute('stroke-width', '3.5');
          shape.removeAttribute('filter');
        }
      });

      clone.querySelectorAll('.edge-group').forEach((edge) => {
        const from = edge.getAttribute('data-from') || '';
        const isLeftEdge = from.startsWith('L-');
        const isMiddleEdge = from.startsWith('M-');
        const endpointsOpen = isLeftEdge
          ? leftOpen && middleOpen
          : isMiddleEdge
            ? middleOpen && rightOpen
            : false;

        if (!endpointsOpen || isHidden || (isDimmed && !edge.classList.contains('is-active'))) {
          edge.setAttribute('opacity', '0');
          return;
        }

        edge.setAttribute('opacity', '1');
        if (edge.classList.contains('is-active')) {
          const path = edge.querySelector('.edge');
          const halo = edge.querySelector('.edge-halo');
          if (path) path.setAttribute('stroke-width', '10');
          if (halo) {
            halo.setAttribute('opacity', '1');
            halo.setAttribute('stroke-width', '16');
          }
        }
      });

      clone.querySelectorAll('.diagram-extras').forEach((el) => {
        el.setAttribute('opacity', anyOpen ? '1' : '0');
      });
    }

    async function savePdf() {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        window.print();
        return;
      }

      pdfButton.disabled = true;
      pdfButton.textContent = '저장 중…';

      try {
        const clone = diagram.cloneNode(true);
        clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        clone.setAttribute('width', '1600');
        clone.setAttribute('height', '900');
        prepareCloneForExport(clone);

        const svgText = new XMLSerializer().serializeToString(clone);
        const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const img = await loadImage(url);
        URL.revokeObjectURL(url);

        const canvas = document.createElement('canvas');
        canvas.width = 1600;
        canvas.height = 900;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#EEF3FB';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: 'landscape',
          unit: 'px',
          format: [1600, 900],
          hotfixes: ['px_scaling'],
        });
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 1600, 900);
        pdf.save('품사와_문장성분.pdf');
      } catch (error) {
        console.error(error);
        window.print();
      } finally {
        pdfButton.disabled = false;
        pdfButton.textContent = 'PDF 저장';
      }
    }

    headerEls.forEach((header) => {
      const activate = (event) => {
        event.stopPropagation();
        toggleColumn(header.dataset.column);
      };
      header.addEventListener('click', activate);
      header.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          activate(event);
        }
      });
    });

    nodeEls.forEach((el) => {
      el.addEventListener('click', (event) => {
        event.stopPropagation();
        activateNode(el.dataset.nodeId, event.ctrlKey || event.metaKey);
      });
      el.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          activateNode(el.dataset.nodeId, event.ctrlKey || event.metaKey);
        }
      });
    });

    resetButton.addEventListener('click', (event) => {
      event.stopPropagation();
      toggleArrowView();
    });

    pdfButton.addEventListener('click', savePdf);

    diagram.addEventListener('click', (event) => {
      if (event.target === diagram) showAllArrows();
    });

    syncColumnClasses();
    updateToggleButton();
  </script>
